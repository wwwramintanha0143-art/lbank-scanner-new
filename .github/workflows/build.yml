name: Build LBank Scanner APK

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Extract Android project
    run: |
      unzip -o LBankScannerAndroid_project_clean.zip
      test -f LBankScannerAndroid/app/build.gradle.kts

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.11.1'

  - name: Build APK
    working-directory: LBankScannerAndroid
    run: gradle assembleDebug --no-daemon

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: LBankScanner-debug-APK
      path: LBankScannerAndroid/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
      retention-days: 7
